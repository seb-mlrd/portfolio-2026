# Local : docker compose --profile dev up -d   (ajoute Mailpit, boîte mail de test)
# VPS   : docker compose up -d                 (derrière ton reverse proxy HTTPS)
name: portfolio-n8n

services:
  n8n:
    image: n8nio/n8n:2.49.5
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?à définir dans n8n/.env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway" # nécessaire sous Linux
    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    restart: unless-stopped
    # Accès local seulement : utile si n8n tourne hors de Docker
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3002}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mailpit:
    image: axllent/mailpit:v1.34.0
    profiles: [dev]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025" # interface web
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  n8n_data:
